name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-image:
    name: build api image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only (no push) to catch Dockerfile breakage.
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: companybrain/api:ci

  web-image:
    name: build web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The web Dockerfile may not exist yet; skip cleanly if absent.
      - name: Check for web Dockerfile
        id: check
        run: |
          if [ -f apps/web/Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "apps/web/Dockerfile not present yet; skipping web image build."
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: companybrain/web:ci

  stack:
    name: boot the compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The two jobs above prove each Dockerfile builds. They cannot tell
      # whether the container then starts: an image missing a runtime
      # dependency builds cleanly and crash-loops on a user's machine. Bring
      # the real stack up and wait for every healthcheck to pass.
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: API answers
        run: curl -fsS http://localhost:3333/health

      - name: Dashboard answers
        run: curl -fsS -o /dev/null http://localhost:3000/

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
