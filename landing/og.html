    <style>
      @font-face {

        font-weight: 100 700;
        font-stretch: 75% 100%;
        font-display: swap;
      }
      @font-face {

        src: url("fonts/ibm-plex-mono-500.woff2") format("woff2");
        font-weight: 500;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #ffaf00;
        color: #101936;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        padding: 76px 80px;
        display: flex;
        flex-direction: column;
      }
      .wordmark {
        display: block;
        width: 100%;
        height: auto;
      }
      .r1,
      .r2,
      .r3,
      .r4,
      .r5 {
        fill: #101936;
      }
      h1 {
        margin: 62px 0 0;
        font-size: 62px;
        line-height: 1.08;
        font-weight: 600;
        font-stretch: 90%;
        letter-spacing: -0.018em;
        max-width: 17em;
      }
      .foot {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 32px;
        font-size: 27px;
      }
      code {
        font: 500 30px "IBM Plex Mono", ui-monospace, Menlo, monospace;
        background: #fff;
        border: 3px solid #101936;
        padding: 14px 24px;
      }
    </style>
